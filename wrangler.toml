name = "hindsight-cf"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "hindsight-db"
database_id = "TODO-replace-with-actual-id"
migrations_dir = "migrations"

# Vectorize Index (768 dims for bge-base-en-v1.5)
[[vectorize]]
binding = "VECTORIZE"
index_name = "hindsight-vectors"

# R2 Bucket (for file/document storage)
[[r2_buckets]]
binding = "R2"
bucket_name = "hindsight-files"

# Workers AI
[ai]
binding = "AI"

# Queue Producer (for async operations)
[[queues.producers]]
binding = "QUEUE"
queue = "hindsight-jobs"

# Queue Consumer
[[queues.consumers]]
queue = "hindsight-jobs"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "hindsight-jobs-dlq"

# Environment variables
[vars]
HINDSIGHT_VERSION = "0.1.0"
DEFAULT_LLM_MODEL = "@cf/meta/llama-3.1-70b-instruct"
DEFAULT_EMBEDDING_MODEL = "@cf/baai/bge-base-en-v1.5"
DEFAULT_RERANKER_MODEL = "@cf/baai/bge-reranker-base"
EMBEDDING_DIMENSIONS = "768"
